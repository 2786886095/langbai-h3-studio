[package]
name = "langbai-h3-studio"
version = "0.5.0"
description = "Langbai H3 Studio"
authors = ["Langbai H3 Studio contributors"]
license = "Apache-2.0"
edition = "2024"

[lib]
name = "langbai_h3_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
url = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
rand = "0.10"
sha2 = "0.10"
zip = "4"
sevenz-rust = { version = "0.6.1", default-features = false }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["fs"] }
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
tempfile = "3"
